name: Generate lockfile and audit dependencies

on:
  push:
    branches:
      - security/remediation-host-errors-headers

permissions:
  contents: write

jobs:
  lockfile-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remediation-host-errors-headers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Create dependency audit summary
        shell: bash
        run: |
          mkdir -p security
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const rows = Object.entries(vulnerabilities).map(([name, item]) => {
            const fix = item.fixAvailable;
            const fixText = fix === true ? 'Non-breaking fix available (exact version not supplied by npm).' :
              fix && typeof fix === 'object' ? `${fix.name || name} ${fix.version || 'version not specified'}${fix.isSemVerMajor ? ' (major upgrade)' : ''}` :
              'No automatic safe fix identified; review manually.';
            return `| ${name} | ${item.severity} | ${item.isDirect ? 'Direct' : 'Transitive'} | ${(item.range || '').replace(/\\|/g, '\\\\|')} | ${fixText.replace(/\\|/g, '\\\\|')} |`;
          });
          const counts = audit.metadata?.vulnerabilities || {};
          const body = [
            '# Dependency audit',
            '',
            `Generated from the branch lockfile using Node ${process.version}.`,
            '',
            `Totals: ${counts.info || 0} info, ${counts.low || 0} low, ${counts.moderate || 0} moderate, ${counts.high || 0} high, ${counts.critical || 0} critical.`,
            '',
            '| Package | Severity | Type | Affected range | Suggested fix |',
            '|---|---|---|---|---|',
            ...(rows.length ? rows : ['| None | — | — | — | No known advisories reported. |']),
            '',
            'This report does not apply automatic dependency upgrades. Review major-version changes and rerun the build/tests before merging.',
            ''
          ].join('\\n');
          fs.writeFileSync('security/dependency-audit.md', body);
          NODE
      - name: Commit generated lockfile and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json security/dependency-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate npm lockfile and dependency audit"
            git push origin HEAD:security/remediation-host-errors-headers
          fi
